[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bullettime"
version = "0.3.0"
description = "Bullet time from one phone shot: freeze any moment and orbit the camera around it, with open-weights ComfyUI workflows"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Aleksandar Perisic"}]
requires-python = ">=3.10"
# mediapipe (eye check) needs opencv-contrib-python, so that is the one OpenCV package (two would clash);
# <5 because OpenCV 5 no longer ships the Haar cascades orient.py uses
dependencies = ["numpy", "requests", "mediapipe>=0.10.30", "opencv-contrib-python<5", "Pillow>=10",
                "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
bullettime = "bullettime.cli:main"

[tool.setuptools]
packages = ["bullettime"]

[tool.setuptools.package-data]
bullettime = ["web/*"]
